<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>G2 親子運動會報名｜暫停受理</title>
<style>
  :root{--navy:#1E2A5A;--maroon:#A3203A;--cream:#FFF8EC;--ink:#1d2340}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
       background:var(--cream);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
  .card{max-width:440px;width:100%;background:#fff;border-radius:24px;padding:36px 28px;text-align:center;
        box-shadow:0 10px 30px rgba(30,42,90,.12);border-top:10px solid var(--navy)}
  .emoji{font-size:56px;line-height:1}
  h1{margin:14px 0 6px;font-size:24px;color:var(--navy)}
  .tag{display:inline-block;margin:6px 0 16px;padding:6px 16px;border-radius:999px;background:var(--maroon);color:#fff;font-weight:700;font-size:15px}
  p{margin:8px 0;font-size:16px;line-height:1.7}
  .small{font-size:14px;color:#6a6f86;margin-top:18px}
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🏃‍♀️🏃</div>
    <h1>二年級親子運動會</h1>
    <div class="tag">報名暫停受理</div>
    <p>報名表目前暫時關閉，<br>感謝各位家長的支持！</p>
    <p>如有報名或繳費相關問題，<br>請聯繫各班班代或總務。</p>
    <p class="small">2026/11/14（六）操場見！🌈</p>
  </div>
</body>
</html>
